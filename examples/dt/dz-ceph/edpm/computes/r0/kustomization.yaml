---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../dz-storage/edpm/computes/r0

patches:
  # Remove the nova-custom and neutron-metadata patches if using a cell per AZ.
  - target:
      kind: OpenStackDataPlaneService
      name: nova-custom-az0
    patch: |-
      - op: replace
        path: /spec/dataSources/2/secretRef/name
        value: nova-cell1-compute-config
  - target:
      kind: OpenStackDataPlaneService
      name: neutron-metadata-az0
    patch: |-
      - op: replace
        path: /spec/dataSources/1/secretRef/name
        value: nova-metadata-neutron-config
  - target:
      kind: ConfigMap
      name: nova-extra-config-az0
    patch: |-
      - op: replace
        path: /data/25-nova-extra.conf
        value: |
          [glance]
          endpoint_override = https://glance-az0-internal.openstack.svc:9292
          valid_interfaces = internal
          [cinder]
          cross_az_attach = True
          catalog_info = volumev3:cinderv3:internalURL
  - target:
      kind: OpenStackDataPlaneNodeSet
      name: r0-compute-nodes
    patch: |-
      - op: remove
        path: /spec/services/14
      - op: remove
        path: /spec/services/13
      - op: add
        path: /spec/services/5
        value: ceph-hci-pre
      - op: add
        path: /spec/nodeTemplate/ansible/ansibleVars/edpm_ceph_hci_pre_enabled_services
        value:
          - ceph_mon
          - ceph_mgr
          - ceph_osd
      - op: add
        path: /spec/nodeTemplate/ansible/ansibleVars/edpm_nodes_validation_check_for_fqdn
        value: false
      - op: add
        path: /spec/nodeTemplate/extraMounts
        value:
          - extraVolType: Ceph
            mounts:
              - mountPath: /etc/ceph
                name: ceph
                readOnly: true
            volumes:
              - name: ceph
                secret:
                  secretName: ceph-conf-files
