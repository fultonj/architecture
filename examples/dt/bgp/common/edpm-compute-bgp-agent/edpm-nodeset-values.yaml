# yamllint disable rule:line-length
# local-config: referenced, but not emitted by kustomize
#
# Shared BGP EDPM compute nodeset values (ovn-bgp-agent). Rack overlays
# under examples/dt/bgp_dt*/edpm/{{computes,networkers}}/*/values/ merge
# on top of this base (hostname, IPs, BGP peers, NIC mappings, and any
# per-rack eBGP ansibleVars).
#
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edpm-nodeset-values
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  ssh_keys:
    # Authorized keys that will have access to the dataplane computes via SSH
    authorized: CHANGEME
    # The private key that will have access to the dataplane computes via SSH
    private: CHANGEME2
    # The public key that will have access to the dataplane computes via SSH
    public: CHANGEME3
  nodeset:
    ansible:
      ansibleUser: cloud-admin
      ansiblePort: 22
      ansibleVars:
        # TODO(mblue): enable FQDN check to allow migration tests
        edpm_nodes_validation_check_for_fqdn: false
        edpm_ovn_bgp_agent_reconcile_interval: 999999
        edpm_ovn_encap_ip: "{{ bgpmainnet_ip }}"
        edpm_ovn_bridge_mappings:
          - "datacentre:br-ex"
          - "octavia:br-octavia"
        edpm_ovn_bgp_agent_expose_tenant_networks: true
        edpm_frr_bgp_ipv4_src_network: bgpmainnet
        edpm_frr_bgp_ipv6_src_network: bgpmainnetv6
        edpm_frr_bgp_neighbor_password: f00barZ
        timesync_ntp_servers:
          - hostname: pool.ntp.org
        # conntrack is necessary for some tobiko tests
        edpm_bootstrap_command: |
          dnf -y install conntrack-tools
        edpm_network_config_hide_sensitive_logs: false
        edpm_network_config_template: |
          ---
          {% set mtu_list = [ctlplane_mtu] %}
          {% for network in nodeset_networks %}
          {% set _ = mtu_list.append(lookup('vars', networks_lower[network] ~ '_mtu')) %}
          {%- endfor %}
          {% set min_viable_mtu = mtu_list | max %}
          network_config:
          - type: ovs_bridge
            name: {{ neutron_physical_bridge_name }}
            use_dhcp: false
            use_dhcpv6: true  # needed to enable IPv6 on bridges
          - type: ovs_bridge
            name: br-octavia
            use_dhcp: false
            use_dhcpv6: true  # needed to enable IPv6 on bridges
          - type: interface
            name: nic1
            use_dhcp: true
            defroute: false
          - type: interface
            name: nic2
            use_dhcp: false
            defroute: false
            dns_servers: {{ ctlplane_dns_nameservers }}
            domain: {{ dns_search_domains }}
            addresses:
              - ip_netmask: {{ ctlplane_ip }}/{{ ctlplane_cidr }}
          - type: interface
            name: nic3
            use_dhcp: false
            addresses:
            - ip_netmask: {{ bgpnet0_ip }}/30
          - type: interface
            name: nic4
            use_dhcp: false
            addresses:
            - ip_netmask: {{ bgpnet1_ip }}/30
          - type: interface
            name: lo
            addresses:
            - ip_netmask: {{ bgpmainnet_ip }}/32
            - ip_netmask: {{ bgpmainnetv6_ip }}/128
        edpm_sshd_allowed_ranges:
          - 192.168.122.0/24
        edpm_sshd_configure_firewall: true
        gather_facts: false
        neutron_physical_bridge_name: br-ex
        neutron_public_interface_name: eth1
    networks:
      - defaultRoute: true
        name: CtlPlane
        subnetName: subnet1
      - name: BgpNet0
        subnetName: subnet0
      - name: BgpNet1
        subnetName: subnet0
      - name: BgpMainNet
        subnetName: subnet0
      - name: BgpMainNetV6
        subnetName: subnet0
      - name: BgpNet0
        subnetName: subnet1
      - name: BgpNet1
        subnetName: subnet1
      - name: BgpMainNet
        subnetName: subnet1
      - name: BgpMainNetV6
        subnetName: subnet1
      - name: BgpNet0
        subnetName: subnet2
      - name: BgpNet1
        subnetName: subnet2
      - name: BgpMainNet
        subnetName: subnet2
      - name: BgpMainNetV6
        subnetName: subnet2
    nodes: {}
    services:
      - bootstrap
      - download-cache
      - install-os
      - configure-os
      - configure-network
      - frr
      - validate-network
      - run-os
      - reboot-os
      - install-certs
      - ovn
      - neutron-metadata
      - ovn-bgp-agent
      - libvirt
      - nova
  nova:
    migration:
      ssh_keys:
        private: CHANGEME4
        public: CHANGEME5
